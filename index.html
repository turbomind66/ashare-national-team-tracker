  body {

  }
  a.btn:hover { background: #1a5fd0; }
  code { background: #f1f3f6; border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .old { font-size: 12.5px; color: #8b95a1; margin-top: 18px; word-break: break-all; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border-color: #30363d; box-shadow: none; }
    p { color: #9198a1; }
    .tag { color: #f0b27a; background: #2a1d12; border-color: #4a3520; }
